<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Birthday Cake</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f8a6b1;
        font-family: Arial, sans-serif;
        flex-direction: column;
        overflow: hidden;
      }

      /* Bánh rơi xuống mượt hơn */
      .cake {
        position: relative;
        width: 200px;
        height: 120px;
        background: #8b5e3c;
        border-radius: 0 0 10px 10px;
        box-shadow: inset 0 -10px #6d4426;
        transform: translateY(-300px);
        animation: drop 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      @keyframes drop {
        0% {
          transform: translateY(-300px);
          opacity: 0;
        }
        60% {
          transform: translateY(20px);
          opacity: 1;
        }
        100% {
          transform: translateY(0);
        }
      }

      /* Lớp kem */
      .icing {
        position: absolute;
        top: -30px;
        left: 0;
        width: 100%;
        height: 40px;
        background: #fff;
        border-radius: 20px 20px 0 0;
        overflow: hidden;
      }

      .icing::after {
        content: "";
        position: absolute;
        bottom: -15px;
        left: 30px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
      }

      /* Nến xuất hiện trễ hơn để mượt */
      .candle {
        position: absolute;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 40px;
        background: #fff;
        border-radius: 5px;
        opacity: 0;
        animation: fadeIn 1s ease forwards;
        animation-delay: 0.8s;
      }

      /* Ngọn lửa lung linh */
      .flame {
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 20px;
        background: orange;
        border-radius: 50%;
        opacity: 0;
        animation:
          flicker 0.3s infinite alternate,
          fadeIn 0.5s ease forwards;
        animation-delay: 1.2s, 1.2s;
      }

      @keyframes flicker {
        from {
          transform: translateX(-50%) scaleY(1);
          opacity: 1;
        }
        to {
          transform: translateX(-50%) scaleY(0.8);
          opacity: 0.8;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Chữ xuất hiện mượt */
      h2 {
        margin-top: 40px;
        color: #fff;
        font-size: 24px;
        opacity: 0;
        animation: fadeIn 1s ease forwards;
        animation-delay: 1.5s;
      }

      p {
        color: #5a2e2e;
        margin: 0;
        font-size: 18px;
        opacity: 0;
        animation: fadeIn 1s ease forwards;
        animation-delay: 2s;
      }
    </style>
  </head>
  <body>
    <div class="cake">
      <div class="icing"></div>
      <div class="candle">
        <div class="flame"></div>
      </div>
    </div>
    <h2>Happy Birthday!</h2>
    <p>Tạ Thị Ngọc Oanh</p>
  </body>
</html>
